[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job0t"
version = "0.1.0"
description = "Herramienta CLI para buscar, normalizar, clasificar y reportar ofertas laborales"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "job0t team" }
]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "questionary>=2.0.1",
    "openpyxl>=3.1.2",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
job0t = "job0t.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
